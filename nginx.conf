server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas del Angular Router (hero-list, hero-form, etc.) no existen como
    # archivos físicos: cualquier ruta desconocida cae en index.html para que
    # el router del lado del cliente la resuelva.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}