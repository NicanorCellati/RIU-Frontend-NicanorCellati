<div
  class="fixed inset-0 z-[1000] flex items-center justify-center bg-slate-900/55"
  (click)="onCancel()"
>
  <div
    class="w-[min(360px,90vw)] rounded-[10px] bg-white p-6 shadow-2xl"
    (click)="$event.stopPropagation()"
    role="alertdialog"
    aria-modal="true"
  >
    <h3 class="m-0 mb-2 text-base font-semibold text-slate-800">{{ title() }}</h3>
    <p class="m-0 mb-5 text-sm leading-normal text-slate-600">{{ message() }}</p>
    <div class="flex justify-end gap-2">
      <button
        type="button"
        class="cursor-pointer rounded-md border-none bg-slate-100 px-4 py-2 text-sm text-slate-700 hover:opacity-90"
        (click)="onCancel()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="cursor-pointer rounded-md border-none bg-red-600 px-4 py-2 text-sm text-white hover:opacity-90"
        (click)="onConfirm()"
      >
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
